global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'roip-bronze-stream'
    static_configs:
      - targets: ['host.docker.internal:8000']
    scrape_interval: 10s

  - job_name: 'roip-silver-job'
    static_configs:
      - targets: ['host.docker.internal:8001']

  - job_name: 'roip-gold-job'
    static_configs:
      - targets: ['host.docker.internal:8002']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']