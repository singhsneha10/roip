name: ROIP CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  JAVA_VERSION:   "17"

jobs:
  # ── Job 1: Code quality ─────────────────────────────────────────────
  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install black==24.4.2 ruff==0.4.4

      - name: Check formatting (black)
        run: black --check --diff .

      - name: Check linting (ruff)
        run: ruff check .

  # ── Job 2: Unit tests ───────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Java (required for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-amd64

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── Job 3: Integration tests ────────────────────────────────────────
  integration-tests:
    name: Integration tests (Spark)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-amd64

  # ── Job 4: Docker build ─────────────────────────────────────────────
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build streaming job image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.streaming
          push: false    # set to true + add registry login for prod deploy
          tags: roip-streaming:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Job 5: Schema validation ────────────────────────────────────────
  schema-validation:
    name: Avro schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install fastavro
        run: pip install fastavro

      - name: Validate Avro schemas
        run: python scripts/validate_schemas.py